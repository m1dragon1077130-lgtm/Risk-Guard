name: Debug User API

on:
  workflow_dispatch:

jobs:
  run-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Debug Script
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
          TT_API_SECRET: ${{ secrets.TT_API_SECRET }}
        run: python debug_user.py
