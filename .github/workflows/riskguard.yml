name: RiskGuard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-riskguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RiskGuard
        env:
          TT_API_KEY: ${{ secrets.TT_API_KEY }}
          TT_API_SECRET: ${{ secrets.TT_API_SECRET }}
          RISK_PERCENT: "3.0"
          ONLY_ONE_TRADE: "true"
          LOCK_STOP_LOSS: "true"
        run: python riskguard.py

      - name: Commit updated state
        run: |
          git config user.name "riskguard-bot"
          git config user.email "riskguard-bot@users.noreply.github.com"
          git add state.json || true
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push || true
