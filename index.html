
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiskGuard - مدیریت سرمایه</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      text-align: center;
      background: rgba(30, 41, 59, 0.6);
      padding: 50px 30px;
      border-radius: 20px;
      border: 1px solid #334155;
      max-width: 500px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: #22c55e;
      color: #fff;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 42px;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">✅ سایت فعال است</div>
    <h1>🚀 RiskGuard</h1>
    <p>ربات مدیریت سرمایه برای TheTrueTrade</p>
    <a href="/login.html" class="btn">ورود به پنل</a>
    <p style="margin-top: 30px; font-size: 13px;">
      نسخه‌ی اولیه — در حال تکمیل
    </p>
  </div>
</body>
</html>
