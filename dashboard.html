<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد - RiskGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; color: #3b82f6; margin: 0; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #3b82f6;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #94a3b8;
    }
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .status.active { background: #22c55e; color: #fff; }
    .status.inactive { background: #ef4444; color: #fff; }
    .status.pending { background: #f59e0b; color: #fff; }
    .logout {
      padding: 8px 16px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn {
      padding: 12px 24px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #2563eb; }
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #94a3b8; }
    .loading { text-align: center; padding: 40px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 RiskGuard</h1>
      <div class="user-info">
        <span id="userName">...</span>
        <img id="userAvatar" class="avatar" src="" alt="">
        <button class="logout" onclick="logout()">خروج</button>
      </div>
    </div>

    <div id="content">
      <div class="loading">⏳ در حال بارگذاری...</div>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function loadProfile() {
      try {
        const resp = await fetch('/api/user/profile');
        
        if (resp.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        
        const data = await resp.json();
        
        if (!data.ok) {
          document.getElementById('content').innerHTML =
            `<div class="card" style="color:#ef4444">❌ خطا: ${data.error}</div>`;
          return;
        }
        
        currentUser = data.user;
        renderDashboard();
        
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="card" style="color:#ef4444">❌ خطا در اتصال</div>`;
      }
    }

    function renderDashboard() {
      const u = currentUser;
      
      document.getElementById('userName').textContent = u.username || 'کاربر';
      if (u.avatar) {
        document.getElementById('userAvatar').src = u.avatar;
      }
      
      const statusClass = u.has_paid ? 'active' : 'pending';
      const statusText = u.has_paid ? '✅ فعال' : '⏳ در انتظار پرداخت';
      
      const config = u.config || {};
      
      document.getElementById('content').innerHTML = `
        <div class="card">
          <h2>📊 وضعیت حساب</h2>
          <div class="info-row">
            <span class="info-label">وضعیت:</span>
            <span class="status ${statusClass}">${statusText}</span>
          </div>
          <div class="info-row">
            <span class="info-label">تاریخ عضویت:</span>
            <span>${new Date(u.created_at).toLocaleDateString('fa')}</span>
          </div>
        </div>

        <div class="card">
          <h2>⚙️ تنظیمات مدیریت سرمایه</h2>
          
          <div class="form-group">
            <label>حداکثر ضرر هر معامله ($)</label>
            <input type="number" id="maxLoss" value="${config.max_loss_usd || 1}" step="0.5" min="0.5">
          </div>
          
          <div class="form-group">
            <label>نسبت ریوارد</label>
            <input type="number" id="reward" value="${config.reward_ratio || 5}" step="0.5" min="1">
          </div>
          
          <button class="btn" onclick="saveConfig()">💾 ذخیره</button>
        </div>

        <div class="card">
          <h2>🔑 اتصال به TheTrueTrade</h2>
          <div class="form-group">
            <label>API Key</label>
            <input type="text" id="apiKey" placeholder="کلید API صرافی">
          </div>
          <div class="form-group">
            <label>API Secret</label>
            <input type="password" id="apiSecret" placeholder="API Secret">
          </div>
          <button class="btn" onclick="alert('به‌زودی...')">اتصال</button>
        </div>
      `;
    }

    function saveConfig() {
      alert('به‌زودی...');
    }

    function logout() {
      document.cookie = 'session=; Max-Age=0; Path=/';
      window.location.href = '/login.html';
    }

    loadProfile();
  </script>
</body>
</html>
